<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title id="page-title">Portfolio</title>
  <meta id="meta-description" name="description" content="">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="nav">
  <a class="logo" href="#top" id="logo"><img id="logo-image" src="assets/gsdesign-logo.png" alt="GS Design"></a>
  <nav><a href="#work">WORK</a><a href="#about">ABOUT</a><a href="#contact">CONTACT</a></nav>
</header>

<main id="top">
  <section class="hero">
    <div class="hero-art"><img id="hero-image" src="" alt=""></div>
    <div class="hero-meta"><span>01</span><i></i><p id="hero-eyebrow"></p></div>
    <div class="hero-copy"><h1 id="hero-title"></h1><p id="hero-description"></p></div>
    <div class="hero-side">⊕<br><small>DIGITAL<br>PHYSICAL<br>EXPERIMENTAL</small></div>
    <a class="view-work" href="#work">VIEW WORK <span>↓</span></a>
  </section>

  <section class="selected" id="work">
    <div class="section-head"><span>SELECTED WORK</span><a href="#work">ALL PROJECTS →</a></div>
    <div class="grid three" id="project-grid"></div>
  </section>

  <section class="case" id="case-study">
    <div class="case-top"><span>← ALL PROJECTS</span><span id="case-number"></span></div>
    <div class="case-title">
      <h2 id="case-title"></h2>
      <div id="case-tags"></div>
      <p id="case-description"></p>
    </div>
    <img class="case-hero" id="case-hero" src="" alt="">
    <div class="case-grid" id="case-gallery"></div>
  </section>

  <section class="about" id="about">
    <div class="section-label">ABOUT</div>
    <div class="about-grid">
      <h2 id="about-title"></h2>
      <div class="about-copy" id="about-copy"></div>
    </div>
    <div class="about-images">
      <img src="assets/anatomy.svg" alt="Sculpt study">
      <img src="assets/creature.svg" alt="Creature study">
      <img src="assets/body.svg" alt="Form study">
    </div>
    <div class="services">
      <div><span>SERVICES</span><p id="services-list"></p></div>
      <div class="plus">＋</div>
    </div>
  </section>

  <section class="contact" id="contact">
    <h2>LET’S<br>CREATE<br>SOMETHING<br>BOLD.</h2>
    <div>
      <p>Have a project in mind or want to collaborate? I’d love to hear from you.</p>
      <a id="email" href=""></a>
      <div class="social">
        <a id="instagram" href="">INSTAGRAM</a><br>
        <a id="behance" href="">BEHANCE</a><br>
        <a id="linkedin" href="">LINKEDIN</a>
      </div>
    </div>
    <span class="arrow">→</span>
  </section>
</main>

<footer><span id="footer-name"></span> © 2026 <span id="footer-tagline"></span></footer>

<script src="content.js"></script>
<script src="script.js"></script>
</body>
</html>
